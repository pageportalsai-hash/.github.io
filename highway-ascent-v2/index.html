,49,1.08,61,'coupe'],['Turbo GT',24000,255,55,1.12,64,'gt'],['V8 Fury',60000,285,61,1.04,67,'muscle'],['Apex R',140000,315,68,1.22,72,'super'],['Hyper Nova',320000,350,76,1.27,76,'hyper'],['McLaren 720S',750000,375,84,1.34,82,'mclaren']],COLORS=['#e82e38','#1596ff','#20242b','#f2f2f2','#ffb11b','#6b43e5','#22c46b'];let save=JSON.parse(localStorage.getItem('hax')||'null')||{money:0,owned:[0],car:0,color:0,up:{engine:0,tires:0,brakes:0}},sel=save.car;const persist=()=>localStorage.setItem('hax',JSON.stringify(save));let cvs=$('#game'),ctx=cvs.getContext('2d'),pv=$('#pv'),pctx=pv.getContext('2d'),W,H,D=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;cvs.width=W*D;cvs.height=H*D;ctx.setTransform(D,0,0,D,0,0);let r=pv.parentElement.getBoundingClientRect();pv.width=Math.max(1,r.width*D);pv.height=Math.max(1,r.height*D);pctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);function shade(h,a){let n=parseInt(h.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)+a)),g=Math.max(0,Math.min(255,((n>>8)&255)+a)),b=Math.max(0,Math.min(255,(n&255)+a));return`rgb(${r},${g},${b})`}function drawCar(g,x,y,s,col,type,rot=0){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.fillStyle='#0007';g.beginPath();g.ellipse(0,21,51,15,0,0,6.3);g.fill();g.fillStyle='#090b0f';[-38,38].forEach(q=>{g.beginPath();g.ellipse(q,17,10,17,0,0,6.3);g.fill();g.fillStyle='#c4cbd1';g.beginPath();g.arc(q,17,5,0,6.3);g.fill();g.fillStyle='#090b0f'});let gr=g.createLinearGradient(0,-35,0,25);gr.addColorStop(0,shade(col,42));gr.addColorStop(.48,col);gr.addColorStop(1,shade(col,-38));g.fillStyle=gr;g.beginPath();g.roundRect(-49,-18,98,40,10);g.fill();let rw=type==='hatch'?34:type==='muscle'?44:39,rh=type==='hyper'||type==='mclaren'?18:27;g.beginPath();g.moveTo(-rw,-14);g.quadraticCurveTo(-24,-14,-17,-14-rh);g.quadraticCurveTo(0,-38-rh*.1,22,-14-rh);g.quadraticCurveTo(34,-13,rw,-10);g.lineTo(33,0);g.lineTo(-33,0);g.closePath();g.fill();g.fillStyle='#12283a';g.beginPath();g.moveTo(-19,-18);g.lineTo(-10,-34);g.quadraticCurveTo(0,-39,13,-34);g.lineTo(23,-18);g.closePath();g.fill();g.fillStyle='#10151b';g.fillRect(-35,1,70,9);g.fillStyle='#ff3c4b';g.fillRect(-31,3,14,5);g.fillRect(17,3,14,5);g.fillStyle='#f8e9c6';g.fillRect(-27,15,12,4);g.fillRect(15,15,12,4);if(['super','hyper','mclaren'].includes(type)){g.fillStyle='#111820';g.fillRect(-36,-10,72,3)}g.strokeStyle='#ffffff45';g.beginPath();g.moveTo(-40,-10);g.quadraticCurveTo(0,-27,40,-10);g.stroke();g.restore()}function menu(){let c=CARS[sel];$('#money').textContent=Math.floor(save.money).toLocaleString();$('#name').textContent=c[0];$('#desc').textContent=sel===0?'Balanced starter car.':sel===6?'Ultimate hypercar unlock.':'Faster highway machine.';$('#carList').innerHTML=CARS.map((x,i)=>`<div class="car ${i===sel?'sel':''}" data-i="${i}"><div><b>${x[0]}</b><small>${x[2]} km/h</small></div><div class="price">${save.owned.includes(i)?'OWNED':'$'+x[1].toLocaleString()}</div></div>`).join('');$$('.car').forEach(e=>e.onclick=()=>{sel=+e.dataset.i;menu()});$('#colors').innerHTML=COLORS.map((x,i)=>`<button class="sw ${i===save.color?'on':''}" data-c="${i}" style="background:${x}"></button>`).join('');$$('.sw').forEach(e=>e.onclick=()=>{save.color=+e.dataset.c;persist();menu()});let vals=[['SPEED',c[2]+save.up.engine*8,400],['ACCEL',c[3]+save.up.engine*2,100],['HANDLING',Math.round((c[4]+save.up.tires*.04)*100),150],['BRAKES',c[5]+save.up.brakes*3,100]];$('#stats').innerHTML=vals.map(v=>`<div class="stat"><span>${v[0]}</span><div class="bar"><div class="fill" style="width:${Math.min(100,v[1]/v[2]*100)}%"></div></div><b>${Math.round(v[1])}</b></div>`).join('');let own=save.owned.includes(sel),b=$('#buy');b.textContent=own?(save.car===sel?'SELECTED':'SELECT CAR'):'BUY $'+c[1].toLocaleString();b.onclick=()=>{if(own){save.car=sel;persist();menu()}else if(save.money>=c[1]){save.money-=c[1];save.owned.push(sel);save.car=sel;persist();menu()}};$('#upList').innerHTML=[['engine','ENGINE'],['tires','TYRES'],['brakes','BRAKES']].map(([k,n])=>{let l=save.up[k],cost=1800*(l+1)*(l+1);return`<div class="up"><div><b>${n} ${l}/5</b><small>${k==='engine'?'Top speed + acceleration':k==='tires'?'Faster steering':'Stopping power'}</small></div><button data-u="${k}" ${l>=5?'disabled':''}>${l>=5?'MAX':'$'+cost.toLocaleString()}</button></div>`}).join('');$$('[data-u]').forEach(b=>b.onclick=()=>{let k=b.dataset.u,l=save.up[k],cost=1800*(l+1)*(l+1);if(save.money>=cost&&l<5){save.money-=cost;save.up[k]++;persist();menu()}});preview()}$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===b));$$('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.tab))});function preview(){let r=pv.parentElement.getBoundingClientRect(),w=r.width,h=r.height;pctx.clearRect(0,0,w,h);let sk=pctx.createLinearGradient(0,0,0,h*.55);sk.addColorStop(0,'#75b8e7');sk.addColorStop(1,'#e0f1fa');pctx.fillStyle=sk;pctx.fillRect(0,0,w,h*.55);pctx.fillStyle='#789060';pctx.fillRect(0,h*.55,w,h*.45);pctx.fillStyle='#272d33';pctx.beginPath();pctx.moveTo(w*.12,h);pctx.lineTo(w*.42,h*.55);pctx.lineTo(w*.58,h*.55);pctx.lineTo(w*.88,h);pctx.fill();drawCar(pctx,w*.5,h*.72,2.1,COLORS[save.color],CARS[sel][6])}let playing=false,last=0,dist=0,level=1,run=0,near=0,speed=0,top=0,nit=100,lane=0,traffic=[],spawn=0,keys={},to;function road(z){let h=H*.34,t=1-Math.pow(z/120,1.45);return{y:h+(H*1.08-h)*t,half:W*(.045+.43*t),s:.12+1.45*t}}function world(){let night=(level-1)%12>=8,sunset=(level-1)%12>=5&&(level-1)%12<8,sky=ctx.createLinearGradient(0,0,0,H*.55);if(night){sky.addColorStop(0,'#071326');sky.addColorStop(1,'#31506b')}else if(sunset){sky.addColorStop(0,'#43597b');sky.addColorStop(.6,'#ef8866');sky.addColorStop(1,'#ffd49a')}else{sky.addColorStop(0,'#6bb2e6');sky.addColorStop(1,'#dff3ff')}ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle=night?'#dfe9ff':'#fff0ac';ctx.beginPath();ctx.arc(W*.78,H*.15,night?20:34,0,6.3);ctx.fill();ctx.fillStyle=night?'#172636':'#728979';ctx.beginPath();ctx.moveTo(0,H*.4);for(let x=0;x<=W;x+=90)ctx.lineTo(x,H*.36-Math.sin(x*.01+level)*35);ctx.lineTo(W,H*.55);ctx.lineTo(0,H*.55);ctx.fill();ctx.fillStyle=night?'#15241a':'#728e5c';ctx.fillRect(0,H*.44,W,H*.3);ctx.fillStyle='#242a30';ctx.beginPath();ctx.moveTo(W*.46,H*.34);ctx.lineTo(W*.54,H*.34);ctx.lineTo(W*.98,H);ctx.lineTo(W*.02,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#c8ccce';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.46,H*.34);ctx.lineTo(W*.02,H);ctx.moveTo(W*.54,H*.34);ctx.lineTo(W*.98,H);ctx.stroke();for(let L=-2;L<=2;L++)for(let z=6;z<120;z+=14){let a=road(z),b=road(z+7);ctx.strokeStyle='#f5f5efcc';ctx.lineWidth=Math.max(1,5*a.s);ctx.beginPath();ctx.moveTo(W/2+(L/3)*a.half,a.y);ctx.lineTo(W/2+(L/3)*b.half,b.y);ctx.stroke()}for(let z=10;z<120;z+=14){let p=road(z);[-1,1].forEach(side=>{let x=W/2+side*(p.half+24*p.s);ctx.strokeStyle='#51483f';ctx.lineWidth=Math.max(1,5*p.s);ctx.beginPath();ctx.moveTo(x,p.y);ctx.lineTo(x,p.y-66*p.s);ctx.stroke();if(night){ctx.fillStyle='#fff4bc';ctx.beginPath();ctx.arc(x,p.y-65*p.s,5*p.s,0,6.3);ctx.fill()}})}traffic.slice().sort((a,b)=>b.z-a.z).forEach(t=>{let p=road(t.z);drawCar(ctx,W/2+(t.l/3)*p.half,p.y-18*p.s,p.s*.92,t.c,t.t)});drawCar(ctx,W/2+(lane/3)*(W*.43),H*.81,1.48,COLORS[save.color],CARS[save.car][6]);if(speed>260){ctx.strokeStyle='#ffffff25';for(let i=0;i<22;i++){let x=Math.random()*W,y=H*.4+Math.random()*H*.6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(x-W/2)*.04,y+28);ctx.stroke()}}}function addTraffic(){let lanes=[-2,-1,0,1,2],sh=['hatch','coupe','gt','muscle','super'],co=['#d7dade','#20252b','#c8323a','#1c79c5','#e49120','#319b57'];traffic.push({l:lanes[Math.random()*5|0],z:112+Math.random()*10,v:55+Math.random()*70+level*2,c:co[Math.random()*co.length|0],t:sh[Math.random()*sh.length|0],pass:false});spawn=.65+Math.max(.25,1.7-level*.025)+Math.random()*.4}function toast(t){let e=$('#toast');e.textContent=t;e.style.opacity=1;clearTimeout(to);to=setTimeout(()=>e.style.opacity=0,600)}function update(dt){let c=CARS[save.car],mx=c[2]+save.up.engine*8,acc=c[3]+save.up.engine*2,br=c[5]+save.up.brakes*3,hand=c[4]+save.up.tires*.04,gas=keys.w||keys.ArrowUp||keys.gas,stop=keys.s||keys.ArrowDown||keys.brake,boost=(keys.Shift||keys.shift)&&nit>0&&speed>90;if(gas)speed+=acc*dt;else speed-=17*dt;if(stop)speed-=br*dt;if(boost){speed+=55*dt;nit-=28*dt}else nit=Math.min(100,nit+7*dt);speed=Math.max(35,Math.min(mx+(boost?35:0),speed));lane+=((keys.a||keys.ArrowLeft?-1:0)+(keys.d||keys.ArrowRight?1:0))*hand*1.7*dt;lane=Math.max(-2.35,Math.min(2.35,lane));let m=speed/3.6*dt;dist+=m;level=Math.floor(dist/900)+1;run+=m*(.012+.002*Math.min(level,30));top=Math.max(top,speed);spawn-=dt;if(spawn<=0)addTraffic();traffic.forEach(t=>t.z-=(speed-t.v)/3.6*dt);for(let t of traffic)if(t.z<8&&t.z>-4){let dx=Math.abs(t.l-lane);if(dx<.57)return crash();if(!t.pass&&dx<1.02&&speed>130){t.pass=true;near++;run+=30+level*4;toast('NEAR MISS +$'+(30+level*4))}}traffic=traffic.filter(t=>t.z>-8)}function crash(){if(!playing)return;playing=false;save.money+=Math.floor(run);persist();$('#hud').classList.add('hide');$('#over').classList.remove('hide');$('#goLevel').textContent=level;$('#goCash').textContent='$'+Math.floor(run).toLocaleString();$('#goSpeed').textContent=Math.round(top);$('#summary').textContent=`You survived ${Math.floor(dist).toLocaleString()} m and reached level ${level}.`;menu()}function loop(n){if(!playing)return;let dt=Math.min(.033,(n-last)/1000||.016);last=n;update(dt);world();$('#level').textContent=level;$('#runCash').textContent='$'+Math.floor(run);$('#near').textContent=near;$('#spd').textContent=Math.round(speed);$('#nitro').style.width=nit+'%';$('#progress').style.width=((dist%900)/9)+'%';requestAnimationFrame(loop)}function start(){playing=true;dist=0;level=1;run=0;near=0;speed=65;top=0;nit=100;lane=0;traffic=[];spawn=.2;keys={};$('#menu').classList.add('hide');$('#over').classList.add('hide');$('#hud').classList.remove('hide');last=performance.now();requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()},{passive:false});addEventListener('keyup',e=>keys[e.key]=false);function hold(id,key){let e=$(id);e.onpointerdown=x=>{x.preventDefault();keys[key]=true};e.onpointerup=e.onpointerleave=e.onpointercancel=()=>keys[key]=false}hold('#left','ArrowLeft');hold('#right','ArrowRight');hold('#gas','gas');hold('#brake','brake');$('#start').onclick=start;$('#again').onclick=start;$('#garage').onclick=()=>{$('#over').classList.add('hide');$('#menu').classList.remove('hide');menu()};resize();menu();world();</script></body></html>
