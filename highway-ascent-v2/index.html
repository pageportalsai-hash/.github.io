const mat=(c,r=.45,m=.2)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});function part(g,geo,ma,x,y,z,rx=0,ry=0,rz=0){const q=new THREE.Mesh(geo,ma);q.position.set(x,y,z);q.rotation.set(rx,ry,rz);q.castShadow=true;q.receiveShadow=true;g.add(q);return q}function wheel(rad=.35){const g=new THREE.Group(),t=part(g,new THREE.CylinderGeometry(rad,rad,.31,28),mat(0x080a0d,.72,.06),0,0,0,0,0,Math.PI/2),r=part(g,new THREE.CylinderGeometry(rad*.58,rad*.58,.33,18),mat(0xcad2d9,.2,.92),0,0,0,0,0,Math.PI/2),h=part(g,new THREE.CylinderGeometry(rad*.16,rad*.16,.35,16),mat(0x2b333c,.2,.9),0,0,0,0,0,Math.PI/2);return g}function makeCar(i,color,traffic=false){const c=CARS[i],g=new THREE.Group(),body=new THREE.MeshPhysicalMaterial({color,roughness:.2,metalness:.62,clearcoat:1,clearcoatRoughness:.1}),dark=mat(0x090c11,.2,.78),glass=new THREE.MeshPhysicalMaterial({color:0x16334a,roughness:.05,metalness:.18,transparent:true,opacity:.85}),chrome=mat(0xdce5ea,.16,.96),dims=c.t==='hatch'?[1.72,.48,3.35]:c.t==='muscle'?[1.94,.46,3.95]:c.t==='mclaren'?[1.92,.34,4.18]:[1.83,.4,3.82];part(g,new THREE.BoxGeometry(dims[0],dims[1],dims[2]),body,0,.47,0);part(g,new THREE.BoxGeometry(dims[0]*.93,.17,dims[2]*.35),body,0,.73,-dims[2]*.27,-.06);part(g,new THREE.BoxGeometry(dims[0]*.86,.15,dims[2]*.25),body,0,.69,dims[2]*.32,.05);const cab=c.t==='hatch'?1.72:c.t==='mclaren'?1.52:1.62;part(g,new THREE.BoxGeometry(dims[0]*.69,.48,cab),glass,0,.92,.12);part(g,new THREE.BoxGeometry(dims[0]*.62,.1,cab*.82),body,0,1.18,.14);for(const x of [-dims[0]*.29,dims[0]*.29]){part(g,new THREE.BoxGeometry(.41,.11,.055),new THREE.MeshStandardMaterial({color:0xf2fbff,emissive:0xa8e4ff,emissiveIntensity:traffic?.5:2.2}),x,.61,-dims[2]/2-.045);part(g,new THREE.BoxGeometry(.39,.1,.05),new THREE.MeshStandardMaterial({color:0xff2439,emissive:0xff001d,emissiveIntensity:1.8}),x,.58,dims[2]/2+.04)}part(g,new THREE.BoxGeometry(dims[0]*.52,.15,.05),dark,0,.48,-dims[2]/2-.07);part(g,new THREE.BoxGeometry(dims[0]*. function clear(g){while(g.children.length){const c=g.children.pop();c.traverse(o=>{o.geometry?.dispose();if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose()}})}}function setupGarage(){world.visible=false;trafficGroup.visible=false;garageScene.visible=true;clear(garageScene);const floor=part(garageScene,new THREE.CircleGeometry(13,72),mat(0x08121e,.64,.38),0,0,0,-Math.PI/2);for(let r=2;r<11;r+=2){const ring=part(garageScene,new THREE.RingGeometry(r,r+.035,72),new THREE.MeshBasicMaterial({color:0x14658b,transparent:true,opacity:.5,side:THREE.DoubleSide}),0,.01,0,-Math.PI/2)}garageScene.add(new THREE.PointLight(0x20dfff,22,14,2));preview=makeCar(save.selected,COLORS[save.color]);preview.scale.setScalar(1.34);preview.rotation.y=-.55;preview.position.y=.08;garageScene.add(preview);camera.position.set(0,2.55,7.4);camera.lookAt(0,.7,0)}
const roads=[],marks=[],rails=[],poles=[],scenery=[],SEG=48,COUNT=20;function roadTex(){const c=document.createElement('canvas');c.width=512;c.height=1024;const x=c.getContext('2d');x.fillStyle='#24282d';x.fillRect(0,0,512,1024);for(let i=0;i<7500;i++){const v=32+Math.random()*45;x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(Math.random()*512,Math.random()*1024,1+Math.random()*2,1+Math.random()*2)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,2);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}function tree(x,z,s=1){const g=new THREE.Group();part(g,new THREE.CylinderGeometry(.12,.17,1.5,8),mat(0x563b25,.95,0),0,.75,0);for(let i=0;i<3;i++)part(g,new THREE.ConeGeometry(.75-i*.11,1.6,9),mat(0x205b34,.96,0),0,1.55+i*.55,0);g.position.set(x,0,z);g.scale.setScalar(s);world.add(g);scenery.push(g)}function buildWorld(){clear(world);roads.length=marks.length=rails.length=poles.length=scenery.length=0;const roadM=new THREE.MeshStandardMaterial({map:roadTex(),roughness:.93,metalness:.02}),white=mat(0xf5f5ef,.75,0),should=mat(0x60656a,.95,.03);for(let i=0;i<COUNT;i++){const z=-i*SEG,rd=part(world,new THREE.PlaneGeometry(18,SEG),roadM,0,0,z,-Math.PI/2);roads.push(rd);for(const x of[-9.75,9.75])roads.push(part(world,new THREE.PlaneGeometry(1.5,SEG),should,x,.002,z,-Math.PI/2));for(const x of[-6,-2,2,6])for(let k=0;k<4;k++){const m=part(world,new THREE.PlaneGeometry(.14,5.7),white,x,.014,z-SEG/2+6+k*12,-Math.PI/2);marks.push(m)}for(const x of[-10.25,10.25]){const r=part(world,new THREE.BoxGeometry(.18,.45,SEG),mat(0x9ca3a8,.42,.82),x,.35,z);rails.push(r)}if(i%2===0)for(const x of[-11.4,11.4]){const g=new THREE.Group();part(g,new THREE.CylinderGeometry(.085,.12,6.7,10),mat(0x30363b,.72,.35),0,3.35,0);part(g,new THREE.BoxGeometry(1.1,.09,.09),mat(0x30363b,.72,.35),x<0?.48:-.48,6.15,0);part(g,new THREE.BoxGeometry(.48,.13,.26),new THREE.MeshStandardMaterial({color:0xfff4cc,emissive:0xffd56a,emissiveIntensity:.9}),x<0?.93:-.93,6.03 let mode='menu',keys={},speed=0,xpos=0,distance=0,cash=0,near=0,nitro=1,spawn=0,traffic=[],last=performance.now(),level=1,levelStart=0,shake=0;const LANES=[-7,-3.5,0,3.5,7],LEVEL=900;function diff(l){return{dens:Math.min(1.14,.34+l*.019),min:58+l*1.8,max:112+l*2.7,swerve:Math.min(.38,l*.008),reward:80+l*20}}function environment(){const p=Math.floor((level-1)/4)%4;if(p===3){renderer.setClearColor(0x030915);scene.fog.color.set(0x071426);hemi.intensity=.42;sun.intensity=.22;renderer.toneMappingExposure=.88}else if(p===2){renderer.setClearColor(0xd86f48);scene.fog.color.set(0xcc8061);hemi.intensity=1.2;sun.intensity=2.5;sun.color.set(0xff9f59);renderer.toneMappingExposure=1.17}else{renderer.setClearColor(0x8fc5ef);scene.fog.color.set(0xa9cce7);hemi.intensity=2.35;sun.intensity=3.6;sun.color.set(0xfff2d9);renderer.toneMappingExposure=1.12}}function start(){mode='game';document.body.classList.add('playing');$('#menu').style.display='none';$('#result').classList.remove('show');garageScene.visible=false;world.visible=trafficGroup.visible=true;buildWorld();setupPlayer();clear(trafficGroup);traffic=[];speed=xpos=distance=cash=near=0;nitro=1;spawn=.4;level=1;levelStart=0;environment();camera.position.set(0,4.1,10.5);camera.lookAt(0,.8,-8);last=performance.now();toast('LEVEL 1','#20dcff')}function levelUp(){level++;levelStart=distance;cash+=diff(level).reward;nitro=Math.min(1,nitro+.28);environment();toast('LEVEL '+level+'  +$'+diff(level).reward,'#65ff88')}function crash(){mode='result';document.body.classList.remove('playing');save.money+=Math.floor(cash);persist();$('#summary').textContent='You reached Level '+level+' and drove '+Math.floor(distance)+' m. Upgrade your car and try to go farther.';$('#earned').textContent='$'+fmt(cash);$('#rlevel').textContent=level;$('#rnear').textContent=near;$('#result').classList.add('show')}function spawnCar(){const d=diff(level),lane=LANES[(Math.random()*LANES.length)|0],idx=Math.min(6,Math.floor(Math.random()*Math.min(7,1+level/7))),m=m Car();spawn=Math.max(.2,(1.18-d.dens*.72)*(.67+Math.random()*.62))}for(let i=traffic.length-1;i>=0;i--){const t=traffic[i],rel=Math.max(12,speed-t.v);t.m.position.z+=rel*dt*.116;t.m.position.x=t.lane+(t.sw?Math.sin(performance.now()/520+t.phase)*.48:Math.sin(performance.now()/900+t.phase)*.04);const dz=Math.abs(t.m.position.z-player.position.z),dx=Math.abs(t.m.position.x-player.position.x);if(dz<2.45&&dx<1.42){shake=1.2;crash();return}if(!t.pass&&t.m.position.z>player.position.z+2.1){t.pass=true;if(dx<2.42&&dx>1.42){near++;const b=75+level*5;cash+=b;toast('NEAR MISS +$'+b,'#ffc933')}}if(t.m.position.z>28){trafficGroup.remove(t.m);traffic.splice(i,1)}}$('#level').textContent=level;$('#cash').textContent='$'+fmt(cash);$('#near').textContent=near;$('#prog').style.width=Math.min(100,(distance-levelStart)/LEVEL*100)+'%';$('#spd').textContent=Math.floor(speed);$('#nitro').style.width=nitro*100+'%'}

$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));$$('.panel').forEach(x=>x.classList.remove('on'));t.classList.add('on');$('#'+t.dataset.p).classList.add('on')});$('#play').onclick=()=>{if(save.owned.includes(save.selected))start()};$('#garage').onclick=()=>{mode='menu';$('#result').classList.remove('show');$('#menu').style.display='flex';if(player){scene.remove(player);player=null}setupGarage();refresh()};$('#retry').onclick=start;addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()},{passive:false});addEventListener('keyup',e=>keys[e.code]=false);function hold(id,k){const e=$(id);['pointerdown','touchstart'].forEach(v=>e.addEventListener(v,x=>{x.preventDefault();keys[k]=true},{passive:false}));['pointerup','pointercancel','pointerleave','touchend'].forEach(v=>e.addEventListener(v,x=>{x.preventDefault();keys[k]=false},{passive:false}))}hold('#left','left');hold('#right','right');hold('#gas','gas');hold('#brake','brake');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2.2))});function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000||.016);last=t;if(mode==='game')update(dt);else if(preview)preview.rotation.y+=dt*.18;renderer.render(scene,camera)}setupGarage();refresh();requestAnimationFrame(loop)})();
