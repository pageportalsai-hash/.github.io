<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Race 95 Deluxe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:white;font-family:Inter,system-ui,Arial,sans-serif}#wrap{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at top,#17263c,#07111d 60%)}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:14px;left:14px;right:14px;display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;pointer-events:none}.card{background:linear-gradient(180deg,#14253dcc,#0a1322dd);border:1px solid #ffffff22;border-radius:16px;padding:10px 14px;box-shadow:0 10px 35px #0007,inset 0 1px #ffffff18;backdrop-filter:blur(10px)}.label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#9fb5d0}.value{font-size:clamp(20px,2.2vw,34px);font-weight:900;text-shadow:0 2px 8px #0008}.sub{font-size:12px;color:#9fb5d0;margin-top:4px}.speed{position:absolute;right:16px;bottom:16px;min-width:210px;pointer-events:none}.speed .value{font-size:clamp(38px,5vw,72px);color:#64eaff}.msg{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.msg span{font-size:clamp(70px,15vw,190px);font-weight:1000;opacity:0;transform:scale(.7);transition:.18s;text-shadow:0 10px 30px #000b,0 0 25px #fff3}.msg span.show{opacity:1;transform:scale(1)}.help{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#07101edb;border:1px solid #ffffff18;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:#dcecff;pointer-events:none}.controls{display:none;position:absolute;left:0;right:0;bottom:18px;padding:0 18px;justify-content:space-between;align-items:flex-end;pointer-events:none}.cluster{display:flex;gap:10px;pointer-events:auto}.btn{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:#132642dd;border:1px solid #ffffff2a;font-size:30px;font-weight:900;box-shadow:0 10px 30px #0008;user-select:none;touch-action:none}.pedal{width:86px;height:86px}@media(pointer:coarse){.controls{display:flex}.help{display:none}.hud{grid-template-columns:repeat(2,minmax(130px,1fr));max-width:680px}.speed{bottom:112px}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="1600" height="900"></canvas>
<div class="hud">
<div class="card"><div class="label">Lap</div><div class="value" id="lap">1 / 3</div><div class="sub" id="pos">Position 1 / 2</div></div>
<div class="card"><div class="label">Race Time</div><div class="value" id="time">0:00.000</div><div class="sub" id="best">Best Lap --</div></div>
<div class="card"><div class="label">Lap Time</div><div class="value" id="lapTime">0:00.000</div><div class="sub">Boost pads • drifting</div></div>
<div class="card"><div class="label">Status</div><div class="value" id="status">Get Ready</div><div class="sub">R restart • Space handbrake</div></div>
</div>
<div class="speed card"><div class="label">Speed</div><div class="value"><span id="speed">0</span> <small style="font-size:.42em;color:#d8efff">km/h</small></div></div>
<div class="msg"><span id="message">3</span></div>
<div class="help">Race 95 Deluxe • Arrow keys / WASD • Space drift • R restart</div>
<div class="controls"><div class="cluster"><div class="btn" data-key="ArrowLeft">◀</div><div class="btn" data-key="ArrowRight">▶</div></div><div class="cluster"><div class="btn pedal" data-key="ArrowUp">▲</div><div class="btn pedal" data-key="ArrowDown">▼</div></div></div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),W=c.width,H=c.height;
const el={lap:document.getElementById('lap'),pos:document.getElementById('pos'),time:document.getElementById('time'),best:document.getElementById('best'),lapTime:document.getElementById('lapTime'),status:document.getElementById('status'),speed:document.getElementById('speed'),msg:document.getElementById('message')};
const keys={};addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='r')reset()},{passive:false});addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('.btn').forEach(b=>{let k=b.dataset.key;['pointerdown','pointerenter'].forEach(v=>b.addEventListener(v,e=>{if(v==='pointerenter'&&!e.buttons)return;keys[k]=true;e.preventDefault()},{passive:false}));['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,e=>{keys[k]=false;e.preventDefault()},{passive:false}))});
const world={w:2600,h:1800},ROAD=184,INNER=136;
const nodes=[{x:450,y:1300},{x:300,y:1100},{x:350,y:700},{x:650,y:450},{x:1100,y:360},{x:1650,y:340},{x:2150,y:440},{x:2300,y:760},{x:2160,y:1120},{x:1820,y:1330},{x:1450,y:1280},{x:1120,y:980},{x:900,y:820},{x:650,y:900},{x:520,y:1120}];
function cr(a,b,d,e,t){let t2=t*t,t3=t2*t;return{x:.5*((2*b.x)+(-a.x+d.x)*t+(2*a.x-5*b.x+4*d.x-e.x)*t2+(-a.x+3*b.x-3*d.x+e.x)*t3),y:.5*((2*b.y)+(-a.y+d.y)*t+(2*a.y-5*b.y+4*d.y-e.y)*t2+(-a.y+3*b.y-3*d.y+e.y)*t3)}}
function build(n,count){let o=[],dist=0,last;for(let i=0;i<count;i++){let u=i/count*n.length,j=Math.floor(u),t=u-j,p=cr(n[(j-1+n.length)%n.length],n[j%n.length],n[(j+1)%n.length],n[(j+2)%n.length],t);if(last)dist+=Math.hypot(p.x-last.x,p.y-last.y);o.push({x:p.x,y:p.y,dist});last=p}let total=dist+Math.hypot(o[0].x-o.at(-1).x,o[0].y-o.at(-1).y);for(let i=0;i<o.length;i++){let a=o[(i-1+o.length)%o.length],b=o[(i+1)%o.length],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;o[i].tx=dx/l;o[i].ty=dy/l;o[i].nx=-dy/l;o[i].ny=dx/l;o[i].progress=o[i].dist/total}return o}
const track=build(nodes,620),bg=document.createElement('canvas'),road=document.createElement('canvas'),mask=document.createElement('canvas');bg.width=road.width=mask.width=world.w;bg.height=road.height=mask.height=world.h;const b=bg.getContext('2d'),r=road.getContext('2d'),m=mask.getContext('2d',{willReadFrequently:true});
function path(g){g.beginPath();g.moveTo(track[0].x,track[0].y);for(let i=1;i<track.length;i++)g.lineTo(track[i].x,track[i].y);g.closePath()}
function tree(g,px,py,s){g.save();g.translate(px,py);g.fillStyle='#0002';g.beginPath();g.ellipse(0,s*.22,s*1.05,s*.58,0,0,Math.PI*2);g.fill();g.fillStyle='#744722';g.fillRect(-s*.1,0,s*.2,s*.5);[['#157826',0,-s*.12,s*.56],['#24983a',-s*.34,0,s*.43],['#2eaa43',s*.34,0,s*.42]].forEach(q=>{g.fillStyle=q[0];g.beginPath();g.arc(q[1],q[2],q[3],0,Math.PI*2);g.fill()});g.restore()}
function pond(g,px,py,rx,ry){g.save();g.translate(px,py);g.fillStyle='#d5bd7c';g.beginPath();g.ellipse(0,0,rx*1.08,ry*1.1,0,0,Math.PI*2);g.fill();let z=g.createLinearGradient(-rx,-ry,rx,ry);z.addColorStop(0,'#55dcff');z.addColorStop(1,'#1f79cf');g.fillStyle=z;g.beginPath();g.ellipse(0,0,rx,ry,0,0,Math.PI*2);g.fill();g.restore()}
function boost(g,p){g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(p.ty,p.tx));g.shadowBlur=25;g.shadowColor='#6ff';for(let i=0;i<3;i++){g.fillStyle=i===1?'#baffff':'#00d8ff';g.beginPath();g.moveTo(-28+i*21,-16);g.lineTo(-7+i*21,0);g.lineTo(-28+i*21,16);g.lineTo(-12+i*21,0);g.closePath();g.fill()}g.restore()}
function staticWorld(){let q=b.createLinearGradient(0,0,0,world.h);q.addColorStop(0,'#42d153');q.addColorStop(1,'#258e32');b.fillStyle=q;b.fillRect(0,0,world.w,world.h);for(let i=0;i<1800;i++){b.fillStyle=Math.random()>.5?'#fff1':'#0001';b.beginPath();b.arc(Math.random()*world.w,Math.random()*world.h,.8+Math.random()*2,0,Math.PI*2);b.fill()}for(let i=0;i<100;i++)tree(b,Math.random()*world.w,Math.random()*world.h,20+Math.random()*38);for(let i=0;i<10;i++)pond(b,150+Math.random()*(world.w-300),150+Math.random()*(world.h-300),55+Math.random()*45,35+Math.random()*30);r.lineCap=r.lineJoin='round';path(r);r.strokeStyle='#0003';r.lineWidth=ROAD+52;r.stroke();path(r);r.strokeStyle='#eef2f5';r.lineWidth=ROAD+18;r.stroke();path(r);r.strokeStyle='#363c44';r.lineWidth=ROAD;r.stroke();path(r);r.strokeStyle='#ffffff0c';r.lineWidth=ROAD-28;r.stroke();r.save();r.setLineDash([40,40]);path(r);r.strokeStyle='#ffffff26';r.lineWidth=5;r.stroke();r.restore();for(let i=0;i<track.length;i+=8){let p=track[i],ang=Math.atan2(p.ty,p.tx);for(let side of [-1,1]){r.save();r.translate(p.x+p.nx*ROAD*.55*side,p.y+p.ny*ROAD*.55*side);r.rotate(ang);r.fillStyle=((i/8|0)&1)?'#ff4057':'#fff';r.fillRect(-16,-10,32,20);r.restore()}}let s=track[0];r.save();r.translate(s.x,s.y);r.rotate(Math.atan2(s.ty,s.tx)+Math.PI/2);for(let yy=-ROAD/2,row=0;yy<ROAD/2;yy+=16,row++)for(let xx=-18,col=0;xx<18;xx+=16,col++){r.fillStyle=(row+col)&1?'#000':'#fff';r.fillRect(xx,yy,16,16)}r.restore();[110,280,470].forEach(i=>boost(r,track[i]));m.fillStyle='#000';m.fillRect(0,0,world.w,world.h);m.lineCap=m.lineJoin='round';path(m);m.strokeStyle='#fff';m.lineWidth=INNER;m.stroke()}
staticWorld();
function onRoad(px,py){if(px<0||py<0||px>=world.w||py>=world.h)return false;return m.getImageData(px|0,py|0,1,1).data[0]>127}
function near(px,py,start=0){let best=start,d=1e18;for(let k=-55;k<55;k++){let i=(start+k+track.length)%track.length,p=track[i],dx=px-p.x,dy=py-p.y,v=dx*dx+dy*dy;if(v<d){d=v;best=i}}return best}
function angle(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
function car(sample,color,accent,ai=false){let p=track[sample];return{x:p.x,y:p.y,a:Math.atan2(p.ty,p.tx),v:0,max:ai?10.5:11.8,acc:ai?.17:.24,turn:ai?.052:.058,color,accent,ai,idx:sample,lap:1,progress:p.progress,prev:p.progress,check:false,lapStart:0,finished:false}}
let player,rivals,particles=[],skids=[],race={laps:3,state:'countdown',start:0,finish:0,best:null},cam={x:0,y:0,z:1};
function reset(){player=car(6,'#f3344d','#ffd84d');rivals=[car(25,'#2fa5ff','#fff',true)];particles=[];skids=[];let n=performance.now();race.state='countdown';race.start=n+3600;race.finish=0;player.lapStart=race.start;rivals[0].lapStart=race.start;el.msg.textContent='3';el.msg.className='show';el.status.textContent='Get Ready'}
function dust(px,py,a,count,col='#a9dd7a'){for(let i=0;i<count;i++)particles.push({x:px,y:py,vx:Math.cos(a+Math.PI+(Math.random()-.5))*3,vy:Math.sin(a+Math.PI+(Math.random()-.5))*3,life:14+Math.random()*16,size:2+Math.random()*5,col})}
function skid(px,py,a){skids.push({x:px,y:py,a,life:45});if(Math.random()<.5)particles.push({x:px,y:py,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,life:18,size:3+Math.random()*4,col:'#ffffff88'})}
function padBoost(ca){for(let i of [110,280,470]){let p=track[i];if(Math.hypot(ca.x-p.x,ca.y-p.y)<52){ca.v+=.16;dust(ca.x,ca.y,ca.a,2,'#77efff')}}}
function updateCar(ca,dt,now){let roadOk=onRoad(ca.x,ca.y);if(ca.ai&&race.state==='running'&&!ca.finished){let i=near(ca.x,ca.y,ca.idx);ca.idx=(i+18)%track.length;let t=track[ca.idx],want=Math.atan2(t.y-ca.y,t.x-ca.x);ca.a+=Math.max(-.08,Math.min(.08,angle(ca.a,want)))*dt*.9;ca.v+=ca.acc*.72*dt;ca.v=Math.min(ca.max,ca.v);padBoost(ca)}else if(!ca.ai&&race.state==='running'&&!ca.finished){let f=keys.ArrowUp||keys.w||keys.W,back=keys.ArrowDown||keys.s||keys.S,l=keys.ArrowLeft||keys.a||keys.A,rr=keys.ArrowRight||keys.d||keys.D,h=keys[' '];if(f)ca.v+=ca.acc*dt;if(back)ca.v-=.32*dt;ca.v=Math.max(-3.2,Math.min(roadOk?ca.max:ca.max*.55,ca.v));let steer=(l?-1:0)+(rr?1:0);if(steer&&Math.abs(ca.v)>.12){ca.a+=steer*ca.turn*dt*(h?1.4:1)*(ca.v>=0?1:-1)*Math.min(1.1,.35+Math.abs(ca.v)/4);if(Math.abs(ca.v)>4.4)skid(ca.x,ca.y,ca.a)}if(h)ca.v*=Math.pow(.97,dt);padBoost(ca)}ca.v*=Math.pow(roadOk?.989:.956,dt);ca.x+=Math.cos(ca.a)*ca.v*6.8*dt;ca.y+=Math.sin(ca.a)*ca.v*6.8*dt;ca.x=Math.max(20,Math.min(world.w-20,ca.x));ca.y=Math.max(20,Math.min(world.h-20,ca.y));if(!roadOk){ca.v*=Math.pow(.985,dt);dust(ca.x,ca.y,ca.a,Math.max(1,Math.abs(ca.v)*.35))}let i=near(ca.x,ca.y,ca.idx);ca.idx=i;ca.prev=ca.progress;ca.progress=track[i].progress;if(ca.progress>.45&&ca.progress<.75)ca.check=true;if(ca.prev>.88&&ca.progress<.12&&ca.check&&ca.v>.1){let lap=now-ca.lapStart;ca.lapStart=now;ca.check=false;if(ca.lap>=race.laps){ca.finished=true;if(ca===player){race.state='finished';race.finish=now;el.msg.textContent='FINISH';el.msg.className='show';el.status.textContent='Victory!'}}else{ca.lap++;if(ca===player){race.best=race.best==null?lap:Math.min(race.best,lap);el.msg.textContent='LAP '+ca.lap;el.msg.className='show';setTimeout(()=>{if(race.state==='running')el.msg.className=''},800)}}}}
function drawCar(ca,me=false){x.save();x.translate(ca.x,ca.y);x.rotate(ca.a);x.fillStyle='#0005';x.beginPath();x.ellipse(0,22,38,18,0,0,Math.PI*2);x.fill();x.fillStyle='#121820';x.fillRect(-30,-24,16,10);x.fillRect(14,-24,16,10);x.fillRect(-30,14,16,10);x.fillRect(14,14,16,10);let g=x.createLinearGradient(-35,-25,35,25);g.addColorStop(0,ca.color);g.addColorStop(1,'#8d1725');x.fillStyle=g;x.strokeStyle='#071018';x.lineWidth=4;x.beginPath();x.moveTo(42,0);x.lineTo(28,-20);x.quadraticCurveTo(4,-32,-27,-22);x.lineTo(-40,-12);x.lineTo(-40,12);x.lineTo(-27,22);x.quadraticCurveTo(4,32,28,20);x.closePath();x.fill();x.stroke();x.fillRect(-48,-22,8,44);x.strokeRect(-48,-22,8,44);x.fillStyle='#2db7ff';x.beginPath();x.moveTo(13,-15);x.lineTo(23,0);x.lineTo(13,15);x.lineTo(-10,14);x.lineTo(-10,-14);x.closePath();x.fill();x.stroke();x.strokeStyle=ca.accent;x.lineWidth=5;x.beginPath();x.moveTo(-30,-11);x.lineTo(31,-5);x.stroke();x.fillStyle='#fff';x.strokeStyle='#111';x.lineWidth=2.5;x.font='900 18px Arial';x.textAlign='center';x.textBaseline='middle';x.save();x.rotate(Math.PI/2);x.strokeText(me?'95':'7',0,4);x.fillText(me?'95':'7',0,4);x.restore();if(me&&Math.abs(ca.v)>5){x.globalAlpha=.35;for(let i=0;i<3;i++){x.strokeStyle='#d4f8ff';x.lineWidth=3-i;x.beginPath();x.moveTo(-55-i*8,-8+i*5);x.lineTo(-78-i*10,-12+i*8);x.stroke();x.beginPath();x.moveTo(-55-i*8,8-i*5);x.lineTo(-78-i*10,12-i*8);x.stroke()}}x.restore()}
function fmt(ms){ms=Math.max(0,ms|0);let mn=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),mm=ms%1000;return `${mn}:${String(s).padStart(2,'0')}.${String(mm).padStart(3,'0')}`}
function hud(now){let rt=race.state==='finished'?race.finish-race.start:Math.max(0,now-race.start),lt=Math.max(0,now-player.lapStart),all=[player,...rivals].sort((a,b)=>(b.lap+b.progress)-(a.lap+a.progress)),place=all.indexOf(player)+1;el.lap.textContent=Math.min(player.lap,race.laps)+' / '+race.laps;el.pos.textContent='Position '+place+' / '+all.length;el.time.textContent=fmt(rt);el.lapTime.textContent=fmt(lt);el.best.textContent='Best Lap '+(race.best==null?'--':fmt(race.best));el.speed.textContent=Math.round(Math.abs(player.v)*29);if(race.state==='countdown')el.status.textContent='Countdown';if(race.state==='running')el.status.textContent='Racing'}
function update(now,dt){if(race.state==='countdown'){let left=race.start-now;el.msg.className='show';el.msg.textContent=left>2400?'3':left>1400?'2':left>400?'1':'GO!';if(left<=0){race.state='running';el.status.textContent='Racing';setTimeout(()=>{if(race.state==='running')el.msg.className=''},600)}}updateCar(player,dt,now);rivals.forEach(ca=>updateCar(ca,dt,now));for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.size*=.986;if(p.life<=0||p.size<.4)particles.splice(i,1)}for(let i=skids.length-1;i>=0;i--){skids[i].life-=dt;if(skids[i].life<=0)skids.splice(i,1)}hud(now)}
function draw(){x.clearRect(0,0,W,H);let z=.88+Math.min(.22,Math.abs(player.v)/28);cam.z+=(z-cam.z)*.08;cam.x+=(player.x-cam.x)*.08;cam.y+=(player.y-cam.y)*.08;x.save();x.translate(W/2,H/2);x.scale(cam.z,cam.z);x.translate(-cam.x,-cam.y);x.drawImage(bg,0,0);x.drawImage(road,0,0);for(let s of skids){x.save();x.globalAlpha=Math.max(0,s.life/45)*.45;x.translate(s.x,s.y);x.rotate(s.a);x.fillStyle='#181818';x.fillRect(-11,-2,22,4);x.restore()}drawCar(rivals[0]);drawCar(player,true);for(let p of particles){x.globalAlpha=Math.min(1,p.life/15);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.size,0,Math.PI*2);x.fill()}x.globalAlpha=1;x.restore();let v=x.createRadialGradient(W/2,H/2,120,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,'#0000');v.addColorStop(1,'#0007');x.fillStyle=v;x.fillRect(0,0,W,H)}
let last=performance.now();function loop(now){let dt=Math.min(2.2,(now-last)/16.6667);last=now;update(now,dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
