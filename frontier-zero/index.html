<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#11161b" />
  <title>Frontier Zero - Survival</title>
  <style>
    :root { --ui: rgba(15,20,24,.72); --line: rgba(255,255,255,.22); --text:#f2f5f7; }
    * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
    html,body { margin:0;width:100%;height:100%;overflow:hidden;background:#101417;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none; }
    canvas { display:block;width:100%;height:100%; }
    #hud { position:fixed;inset:0;pointer-events:none;color:var(--text);text-shadow:0 1px 2px #000; }
    #topbar { position:absolute;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px; }
    .panel { background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(6px); }
    #stats { min-width:170px;font-size:12px;line-height:1.35; }
    #inventory { font-size:11px;text-align:right;line-height:1.35; }
    #healthOuter { height:10px;width:145px;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;margin-top:4px;background:#2a2020; }
    #healthInner { height:100%;width:100%;background:linear-gradient(90deg,#d13c3c,#6be36b); }
    #crosshair { position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%); }
    #crosshair:before,#crosshair:after { content:"";position:absolute;background:rgba(255,255,255,.86);box-shadow:0 0 2px #000; }
    #crosshair:before { width:2px;height:18px;left:10px;top:2px; }
    #crosshair:after { height:2px;width:18px;left:2px;top:10px; }
    #message { position:absolute;top:18%;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:rgba(0,0,0,.55);font-size:13px;opacity:0;transition:opacity .2s;white-space:nowrap; }
    #joystickBase { pointer-events:auto;position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(24px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22); }
    #joystickKnob { position:absolute;left:39px;top:39px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.55); }
    #lookZone { pointer-events:auto;position:absolute;right:0;top:0;width:62%;height:100%; }
    .button { pointer-events:auto;position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(30,36,42,.72);border:2px solid rgba(255,255,255,.3);font-weight:750;font-size:12px;letter-spacing:.25px;box-shadow:0 2px 12px rgba(0,0,0,.28); }
    .button:active { transform:scale(.95);background:rgba(80,95,105,.78); }
    #fireBtn { right:max(22px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:86px;height:86px; }
    #reloadBtn { right:118px;bottom:112px;width:58px;height:58px;font-size:10px; }
    #gearBtn { right:182px;bottom:36px;width:62px;height:62px;font-size:10px; }
    #buildBtn { right:255px;bottom:35px;width:62px;height:62px;font-size:10px; }
    #rotateBtn { right:255px;bottom:106px;width:52px;height:52px;font-size:9px;display:none; }
    #buildTypeBtn { right:316px;bottom:106px;width:52px;height:52px;font-size:8px;display:none; }
    #damageFlash { position:absolute;inset:0;background:rgba(180,0,0,.34);opacity:0;transition:opacity .14s; }
    #rotateNotice { position:fixed;inset:0;z-index:20;background:#101417;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px; }
    #desktopNotice { position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:21;color:#fff;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:7px 10px;font-size:11px;pointer-events:none;white-space:nowrap; }
    #loading { position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#101417;color:white;font-size:18px; }
    @media (orientation:portrait) and (pointer:coarse) { #rotateNotice { display:flex; } }
    @media (pointer:fine) { #joystickBase,#lookZone,#fireBtn,#reloadBtn,#gearBtn,#buildBtn,#rotateBtn,#buildTypeBtn,#lootBtn,#jumpBtn { display:none!important; } }
  </style>
</head>
<body>
  <div id="loading">Loading Frontier Zero…</div>
  <div id="rotateNotice">Rotate your phone sideways to play<br><span style="font-size:14px;opacity:.72">Landscape mode</span></div>
  <div id="desktopNotice">MacBook controls loading…</div>
  <div id="hud">
    <div id="topbar">
      <div id="stats" class="panel">
        <div><b>FRONTIER ZERO</b></div>
        <div id="weaponText">Common Rifle · 30 / 120</div>
        <div id="npcText">Hostiles: 50</div>
        <div id="healthOuter"><div id="healthInner"></div></div>
      </div>
      <div id="inventory" class="panel">WOOD 0<br>STONE 0<br>METAL 0<br>BUILD Wall</div>
    </div>
    <div id="crosshair"></div><div id="message"></div><div id="damageFlash"></div>
    <div id="joystickBase"><div id="joystickKnob"></div></div><div id="lookZone"></div>
    <div id="fireBtn" class="button">FIRE</div><div id="reloadBtn" class="button">RELOAD</div>
    <div id="gearBtn" class="button">GEAR</div><div id="buildBtn" class="button">BUILD</div>
    <div id="rotateBtn" class="button">ROTATE</div><div id="buildTypeBtn" class="button">TYPE</div>
  </div>
  <script type="module">
    const parts=['part_00.txt','part_01.txt','part_02c.txt','part_03.txt','part_04.txt','part_05.txt','part_06.txt','part_07.txt','part_08.txt','part_09.txt','part_10.txt','part_11.txt','part_12.txt'];
    try {
      const code=(await Promise.all(parts.map(p=>fetch(p).then(r=>{if(!r.ok)throw new Error(p);return r.text();})))).join('');
      const blob=new Blob([code],{type:'text/javascript'});
      await import(URL.createObjectURL(blob));
      document.getElementById('loading').remove();
    } catch(e) {
      document.getElementById('loading').textContent='Game failed to load. Refresh and try again.';
      console.error(e);
    }
  </script>
</body>
</html>
