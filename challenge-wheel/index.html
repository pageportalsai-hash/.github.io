<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>100 PLN Challenge Wheel</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 15%,#292052,#090713 55%,#030207);color:#fff;font-family:Arial,sans-serif;text-align:center;overflow-x:hidden}.wrap{max-width:1050px;margin:auto;padding:25px 16px 60px}h1{font-size:clamp(32px,6vw,68px);margin:5px;background:linear-gradient(90deg,#ffd54a,#fff,#ff8a00);-webkit-background-clip:text;color:transparent;text-shadow:0 0 35px #ffae0040}.sub{letter-spacing:3px;color:#d7c9ff;font-weight:bold}.stage{display:grid;grid-template-columns:1fr 320px;gap:30px;align-items:center;margin-top:25px}.wheelbox{position:relative;width:min(72vw,620px);aspect-ratio:1;margin:auto;filter:drop-shadow(0 0 35px #8d5cff)}canvas{width:100%;height:100%;transition:transform 5.2s cubic-bezier(.12,.72,.05,1)}.pointer{position:absolute;z-index:3;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:25px solid transparent;border-right:25px solid transparent;border-top:55px solid #ffe65c;filter:drop-shadow(0 0 12px #ffb000)}button{border:0;cursor:pointer;font-weight:900;color:#130817;background:linear-gradient(#fff16a,#ff9d00);box-shadow:0 0 25px #ffb00080;border-radius:16px;padding:18px 35px;font-size:24px}.panel{background:#ffffff0d;border:1px solid #ffffff25;border-radius:24px;padding:22px;backdrop-filter:blur(10px)}.players{display:grid;gap:12px;margin:18px 0}.p{background:#151126;border-radius:14px;padding:13px;border:1px solid #ffffff1c}.p input{background:transparent;border:0;color:white;font-size:18px;font-weight:bold;width:120px;text-align:center}.score{font-size:25px;color:#ffe85b}.smallbtn{padding:6px 12px;font-size:16px;margin:3px}.result{display:none;position:fixed;inset:0;background:#030207eF;z-index:10;align-items:center;justify-content:center;padding:20px}.card{max-width:720px;width:100%;padding:35px;border-radius:28px;background:linear-gradient(145deg,#25135c,#0c0920);border:2px solid #ffd94b;box-shadow:0 0 70px #a05cff}.tag{color:#ffe65c;font-weight:900;letter-spacing:3px}.challenge{font-size:clamp(28px,5vw,52px);font-weight:900;margin:18px}.details{font-size:20px;line-height:1.7}.close{margin-top:22px}.counter{color:#9f91c8;margin:12px}@media(max-width:850px){.stage{grid-template-columns:1fr}.panel{max-width:500px;margin:auto}.wheelbox{width:min(90vw,580px)}}
</style></head><body><div class="wrap"><div class="sub">3 PLAYERS • 100 PLN • ONE WINNER</div><h1>THE CHALLENGE WHEEL</h1><div class="counter">Over 1,000,000,000 possible challenge combinations</div><div class="stage"><div><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="700" height="700"></canvas></div><button id="spin">⚡ SPIN THE WHEEL ⚡</button></div><div class="panel"><h2>🏆 PLAYERS</h2><div class="players" id="players"></div><p>Winner of each challenge gets <b>3 points</b>.</p><button class="smallbtn" onclick="resetScores()">Reset scores</button></div></div></div><div class="result" id="result"><div class="card"><div class="tag" id="tag"></div><div class="challenge" id="challenge"></div><div class="details" id="details"></div><button class="close" onclick="document.getElementById('result').style.display='none'">LET'S DO IT!</button></div></div><script>
const cats=[['🍳 COOK-OFF','#ff4d6d'],['🍰 DESSERT','#ff8fab'],['🏗️ BUILD','#5eead4'],['🎨 CREATE','#a78bfa'],['🥪 FOOD HACK','#fbbf24'],['⚡ SPEED ROUND','#38bdf8'],['🎁 MYSTERY','#fb7185'],['👑 JACKPOT','#facc15']];
const cooking=['Make the best restaurant-quality meal','Create a 3-course mini menu','Make the best dessert','Create the best street food','Make the best snack platter','Make a meal that looks expensive','Make the best breakfast-for-dinner','Create a food from another country','Make the best burger or sandwich','Create the best party food','Make something amazing using potatoes','Make the best chocolate dessert'];
const building=['Build the tallest freestanding tower','Build a mini house strong enough to hold a book','Build a bridge that can carry the most weight','Build the coolest cardboard vehicle','Build a marble run','Build a working catapult using safe household materials','Build the strongest chair for a stuffed toy','Build a mini theme park','Build a boat that can float with coins inside','Build the longest domino-style chain reaction','Build a shop or restaurant model','Build the coolest fort'];
const twists=['You must use one mystery ingredient/material','You may only shop for 10 minutes','One player chooses a required item for everyone','No phones after the timer starts','You must include something red','You must trade one item with another player','You get only 5 minutes to plan','Presentation counts double','You must give your creation a ridiculous name','Halfway through, swap one unused item with another player','You must make an advertisement for your creation','Judging includes creativity, looks and how well it works'];
const times=[30,40,45,50,60,75,90]; const budgets=[60,75,90,100];let rot=0,spinning=false,scores=[0,0,0];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');function draw(){let n=cats.length,r=350;ctx.clearRect(0,0,700,700);cats.forEach((c,i)=>{let a=i*2*Math.PI/n-Math.PI/2,b=(i+1)*2*Math.PI/n-Math.PI/2;ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r-10,a,b);ctx.fillStyle=c[1];ctx.fill();ctx.strokeStyle='#100922';ctx.lineWidth=8;ctx.stroke();ctx.save();ctx.translate(r,r);ctx.rotate((a+b)/2);ctx.textAlign='right';ctx.fillStyle='#100817';ctx.font='900 27px Arial';ctx.fillText(c[0],r-42,9);ctx.restore()});ctx.beginPath();ctx.arc(r,r,83,0,Math.PI*2);ctx.fillStyle='#100817';ctx.fill();ctx.strokeStyle='#ffe65c';ctx.lineWidth=10;ctx.stroke();ctx.fillStyle='#fff';ctx.font='900 24px Arial';ctx.textAlign='center';ctx.fillText('SPIN',r,r+8)}draw();
function renderPlayers(){document.getElementById('players').innerHTML=scores.map((s,i)=>`<div class="p"><input value="${['Shiloh','Micah','Seth'][i]}"><div class="score">${s} pts</div><button class="smallbtn" onclick="add(${i})">+3 WIN</button></div>`).join('')}function add(i){scores[i]+=3;renderPlayers()}function resetScores(){scores=[0,0,0];renderPlayers()}renderPlayers();
function pick(a){return a[Math.floor(Math.random()*a.length)]}document.getElementById('spin').onclick=()=>{if(spinning)return;spinning=true;let chosen=Math.floor(Math.random()*cats.length),seg=360/cats.length;let extra=360*7+(360-(chosen*seg+seg/2));rot+=extra;canvas.style.transform=`rotate(${rot}deg)`;setTimeout(()=>{let isBuild=chosen===2||chosen===3;let challenge=pick(isBuild?building:cooking);if(chosen===7)challenge=pick(cooking.concat(building));let budget=pick(budgets),time=pick(times),twist=pick(twists);document.getElementById('tag').textContent=cats[chosen][0]+' CHALLENGE';document.getElementById('challenge').textContent=challenge;document.getElementById('details').innerHTML=`💰 <b>${budget} PLN TOTAL</b> (${Math.floor(budget/3)} PLN each)<br>⏱️ <b>${time} MINUTES</b><br>⚡ <b>TWIST:</b> ${twist}<br>🏆 Winner gets <b>3 points</b>`;document.getElementById('result').style.display='flex';spinning=false;confetti()},5300)};
function confetti(){for(let i=0;i<70;i++){let d=document.createElement('i');d.style.cssText=`position:fixed;z-index:20;top:-10px;left:${Math.random()*100}vw;width:8px;height:14px;background:hsl(${Math.random()*360} 90% 60%);transform:rotate(${Math.random()*360}deg);transition:top ${2+Math.random()*2}s linear,transform 3s`;document.body.appendChild(d);setTimeout(()=>{d.style.top='110vh';d.style.transform+=' rotate(900deg)'},20);setTimeout(()=>d.remove(),4200)}}
</script></body></html>
