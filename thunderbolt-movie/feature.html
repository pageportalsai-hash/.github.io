<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thunderbolt — Two-Hour Story Edition</title><style>body{margin:0;background:#050819;color:#f5f8ff;font-family:system-ui;text-align:center}header{padding:14px}h1{color:#ffcf59;letter-spacing:.08em}.stage{position:relative;margin:auto;width:min(96vw,1100px);aspect-ratio:16/9;overflow:hidden;border:2px solid #5675c4;border-radius:14px;background:radial-gradient(circle at 55% 50%,#253a83,#07091c 68%)}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:53px 47px;opacity:.45;animation:stars 16s linear infinite}.planet{position:absolute;width:35%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#55c5ff,#17378b 60%,#070e2b);left:-10%;bottom:-30%;box-shadow:0 0 55px #3f8fff77}.hero,.enemy{position:absolute;font-size:clamp(45px,10vw,130px);top:33%;animation:float 3s ease-in-out infinite}.hero{left:18%;filter:drop-shadow(0 0 20px #38caff)}.enemy{right:18%;filter:drop-shadow(0 0 25px #b92dff);animation-delay:-1.3s}.energy{position:absolute;top:45%;left:39%;width:22%;height:6px;background:#6ee9ff;box-shadow:0 0 25px #6ee9ff;transform:rotate(-8deg);animation:zap 3s infinite}.scene{position:absolute;top:7%;left:5%;right:5%;font-size:clamp(18px,3vw,35px);font-weight:900;text-shadow:0 0 18px #121e4d}.sub{position:absolute;bottom:5%;left:6%;right:6%;padding:12px;background:#030817e8;border:1px solid #536fb2;border-radius:8px;font-size:clamp(14px,2vw,23px)}button,select{border:0;border-radius:8px;padding:12px;margin:7px;font-weight:700}button{background:#ffd05d;cursor:pointer}input{width:min(85vw,650px);accent-color:#ffd05d}small{display:block;color:#a7b9da;margin:10px} @keyframes float{50%{transform:translateY(-22px)}}@keyframes stars{to{background-position:53px 47px}}@keyframes zap{50%{opacity:.1;transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><header><h1>⚡ THUNDERBOLT: THE ALIEN INVASION</h1><p>Two-hour illustrated story edition · 24 chapters</p></header><main><div class="stage"><div class="stars"></div><div class="planet"></div><div class="hero" id="hero">🦸</div><div class="enemy" id="enemy">👽</div><div class="energy"></div><div class="scene" id="title"></div><div class="sub" id="line"></div></div><div><button id="play">▶ Play</button><button id="restart">↺ Restart</button><button id="voice">🔊 Voice On</button><button id="skip">Next chapter ⏭</button></div><input type="range" min="0" max="7200" value="0" id="seek" aria-label="Movie position"><div id="time"></div><label>Jump to chapter: <select id="chapter"></select></label><small>This is a two-hour timed, illustrated story experience with browser narration, not a fully animated feature film. Some story beats remain on screen for extended periods.</small></main><script>const chapters=[["The Signal","An impossible transmission reaches Earth.","Thunderbolt hears a voice from the stars.","Every screen displays the Alien King's crest.","The city's lights begin to flicker.","A giant shadow crosses the moon."],["The First Ship","A silver vessel tears through the clouds.","Thunderbolt flies toward the invasion.","The ship fires at the empty harbour.","Thunderbolt shields the waterfront.","A second fleet appears behind the first."],["The King's Demand","Alien King declares Earth his new throne.","The world's leaders refuse his ultimatum.","Alien soldiers land in the capital.","Thunderbolt confronts their commander.","The commander warns of a hidden weapon."],["Powers Awaken","Thunderbolt discovers a new burst of speed.","Lightning dances across his hands.","He bends fire away from trapped civilians.","He freezes a collapsing bridge in place.","The rescue makes him a symbol of hope."],["The Underground","A scientist named Nova sends a secret message.","Thunderbolt enters an abandoned subway.","Nova reveals a map of alien energy towers.","The towers are draining Earth's magnetic field.","They decide to destroy the first tower."],["The Tower Raid","Thunderbolt and Nova approach the eastern tower.","Drones swarm the rooftops.","Thunderbolt uses invisibility to slip past them.","Nova disables the tower's outer shield.","A mechanical guardian wakes beneath the street."],["The Iron Guardian","The guardian rises above the buildings.","Thunderbolt's punches barely scratch its armour.","Nova discovers a weak point in its core.","Thunderbolt channels lightning into the opening.","The guardian falls and the tower goes dark."],["A Fragile Victory","The city celebrates the first victory.","Thunderbolt wonders why it felt too easy.","Nova detects six more energy towers.","The Alien King watches from his throne.","A spy steals Nova's research."],["The Desert Pursuit","The spy escapes toward an ancient desert ruin.","Thunderbolt follows across the dunes.","A sandstorm hides an alien landing craft.","Thunderbolt saves a lost expedition.","The spy vanishes through a glowing portal."],["The Portal","Nova studies the portal's strange symbols.","Thunderbolt steps into a world of floating islands.","Gravity twists around him.","He meets an alien rebel named Kira.","Kira says the King stole his powers."],["Kira's Story","Kira describes a once peaceful alien world.","The King conquered it using a living crown.","The crown feeds on fear and destruction.","Kira offers to help free both planets.","Thunderbolt promises to protect her people."],["The Rebel Base","The heroes reach a hidden rebel outpost.","They meet pilots from a dozen worlds.","Nova repairs an ancient starfighter.","The rebels plan a raid on the royal vault.","A traitor secretly alerts the King."],["The Vault","Thunderbolt enters the fortress disguised as a guard.","Nova guides him through the security maze.","Kira retrieves the crown's original blueprints.","The fortress alarms suddenly sound.","Thunderbolt stays behind to cover their escape."],["The Capture","Alien King traps Thunderbolt in a power cage.","He offers the hero a place at his side.","Thunderbolt refuses to betray Earth.","The King reveals the crown can copy powers.","Thunderbolt's energy begins to fade."],["Earth Without a Hero","Earth's defenders struggle against the fleet.","Nova organizes civilians into rescue teams.","Kira sends a message across the stars.","The world refuses to surrender.","A small child lights a candle for Thunderbolt."],["The Escape","Thunderbolt remembers why he became a hero.","He discovers the cage cannot absorb compassion.","Kira returns with the rebel pilots.","Nova overloads the prison's power system.","Thunderbolt escapes into the night sky."],["The Seven Towers","The team splits into seven rescue missions.","Each tower controls a different part of Earth.","Thunderbolt races between continents.","Nova and Kira disable the final control node.","The towers collapse, but the flagship remains."],["The Last Fleet","Alien warships descend toward the ocean.","The rebels launch their starfighters.","Thunderbolt diverts missiles into empty space.","The flagship opens a planet-sized cannon.","The heroes have only minutes to stop it."],["The Crown's Secret","Nova decodes the final blueprint.","The crown is powered by stolen memories.","Kira knows how to release the trapped minds.","Thunderbolt must enter the King's throne room.","The team prepares for a final confrontation."],["Into the Flagship","Thunderbolt flies through the ship's engine fire.","Nova disables the defence grid.","Kira leads the rebels through the hangar.","The heroes reach the royal chamber.","Alien King stands beneath the glowing crown."],["The Final Battle","Alien King copies Thunderbolt's lightning.","Thunderbolt counters with ice and super speed.","The chamber fractures under their power.","The King grows stronger with every strike.","Thunderbolt realizes fighting harder will not win."],["A Different Kind of Power","Thunderbolt speaks to the trapped memories.","He offers the King a chance to stop.","The crown begins to crack from within.","Kira calls her people's names aloud.","The stolen minds break free in a wave of light."],["The Fall of the King","The Alien King's powers disappear.","The flagship begins to break apart.","Thunderbolt rescues the King despite everything.","The rebels guide the fleet away from Earth.","The city sees sunrise for the first time in days."],["The Dawn","Families reunite across the world.","Kira begins rebuilding her home planet.","Nova opens a school for young inventors.","Thunderbolt watches the stars from a rooftop.","Far away, a mysterious new signal answers."]];const $=x=>document.getElementById(x),TOTAL=7200,CH=300,BEAT=60;let t=0,playing=false,voice=true,last=0,lastBeat=-1;function say(s){if(!voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.rate=.84;speechSynthesis.speak(u)}function clock(s){return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}function render(){const c=Math.min(23,Math.floor(t/CH)),b=Math.min(4,Math.floor((t%CH)/BEAT)),item=chapters[c],beat=c*5+b;$('title').textContent='CHAPTER '+(c+1)+' — '+item[0];$('line').textContent=item[b+1];$('hero').textContent=['🦸','⚡','🦸','💫'][b%4];$('enemy').textContent=['👽','🛸','👑','🌌'][c%4];$('seek').value=t;$('time').textContent=clock(t)+' / 02:00:00';$('chapter').value=c;if(playing&&beat!==lastBeat){lastBeat=beat;say(item[0]+'. '+item[b+1])}}function tick(ms){if(playing){if(last)t+=(ms-last)/1000;if(t>=TOTAL){t=TOTAL;playing=false;$('play').textContent='▶ Replay';if('speechSynthesis'in window)speechSynthesis.cancel()}render()}last=ms;requestAnimationFrame(tick)}chapters.forEach((c,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+c[0];$('chapter').append(o)});$('play').onclick=()=>{if(t>=TOTAL)t=0;playing=!playing;lastBeat=-1;$('play').textContent=playing?'⏸ Pause':'▶ Play';if(!playing&&'speechSynthesis'in window)speechSynthesis.cancel();render()};$('restart').onclick=()=>{t=0;playing=false;lastBeat=-1;$('play').textContent='▶ Play';if('speechSynthesis'in window)speechSynthesis.cancel();render()};$('voice').onclick=()=>{voice=!voice;$('voice').textContent=voice?'🔊 Voice On':'🔇 Voice Off';if(!voice&&'speechSynthesis'in window)speechSynthesis.cancel()};$('skip').onclick=()=>{t=Math.min(TOTAL,Math.ceil((t+.01)/CH)*CH);lastBeat=-1;render()};$('seek').oninput=e=>{t=+e.target.value;lastBeat=-1;render()};$('chapter').onchange=e=>{t=+e.target.value*CH;lastBeat=-1;render()};render();requestAnimationFrame(tick);</script></html>
