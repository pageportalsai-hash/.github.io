<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THUNDERBOLT — The Alien Invasion</title><style>*{box-sizing:border-box}body{margin:0;background:#030612;color:white;font-family:system-ui,Arial;text-align:center}header{padding:22px}h1{letter-spacing:.12em;margin:5px;color:#ffd25a}p{color:#a9c2e5}.screen{position:relative;max-width:1050px;aspect-ratio:16/9;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#263b79,#090c26 65%,#02030a);border:2px solid #4058a0;border-radius:12px;box-shadow:0 0 60px #244bb733}.stars{position:absolute;inset:0;background-image:radial-gradient(white 1px,transparent 1px);background-size:51px 59px;opacity:.45;animation:drift 15s linear infinite}.city{position:absolute;bottom:0;width:100%;height:27%;background:repeating-linear-gradient(90deg,#090f28 0 35px,#182a51 35px 60px,#0b122d 60px 88px);clip-path:polygon(0 45%,8% 45%,8% 10%,15% 10%,15% 55%,23% 55%,23% 0,30% 0,30% 40%,40% 40%,40% 15%,50% 15%,50% 48%,62% 48%,62% 5%,70% 5%,70% 42%,81% 42%,81% 0,88% 0,88% 50%,100% 50%,100% 100%,0 100%)}.hero,.alien{position:absolute;font-size:clamp(45px,10vw,125px);filter:drop-shadow(0 0 20px #4bbfff);transition:all 2s ease}.hero{left:17%;top:37%;animation:bob 2s ease-in-out infinite}.alien{right:14%;top:20%;filter:drop-shadow(0 0 24px #e64cff);animation:bob 3s ease-in-out infinite reverse}.beam{position:absolute;left:35%;top:43%;width:0;height:9px;background:#69e7ff;box-shadow:0 0 25px #35caff;transform:rotate(-10deg);transform-origin:left;transition:width .5s}.blast .beam{width:35%}.blast .screen{animation:shake .25s 4}.title{position:absolute;top:6%;width:100%;font-size:clamp(16px,3vw,35px);font-weight:900;text-shadow:0 0 15px #1f75ff}.caption{position:absolute;bottom:6%;left:7%;width:86%;padding:14px;background:#020615d9;border:1px solid #5e81ba;border-radius:10px;font-size:clamp(13px,2vw,22px)}.controls{padding:20px}button{background:#f7c848;color:#121726;border:0;border-radius:9px;padding:13px 25px;margin:5px;font-weight:800;cursor:pointer}button:hover{background:white}input{width:min(600px,85%);accent-color:#f7c848}small{display:block;color:#8ca9cf;margin:10px}.tag{color:#ffc958;font-weight:700}@keyframes bob{50%{transform:translateY(-25px)}}@keyframes drift{to{background-position:51px 59px}}@keyframes shake{50%{filter:brightness(2);transform:translateX(5px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style><header><h1>⚡ THUNDERBOLT</h1><p>THE ALIEN INVASION · An original animated movie prototype</p></header><main><div class="screen" id="screen"><div class="stars"></div><div class="city"></div><div class="hero" id="hero">🦸</div><div class="alien" id="alien">👽</div><div class="beam"></div><div class="title" id="sceneTitle">THE SKY IS FALLING</div><div class="caption" id="caption">Press Play to begin the adventure.</div></div><div class="controls"><button id="play">▶ Play Movie</button><button id="restart">↺ Restart</button><button id="mute">🔊 Narration On</button><div><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Movie progress"></div><span id="clock">00:00 / 03:00</span><small>Animated 3-minute proof of concept — not yet a finished two-hour feature film.</small></div></main><script>const scenes=[["A QUIET NIGHT","For years, Earth had been peaceful. But beyond the stars, someone was watching.","🦸","🛸"],["THE INVASION","An enormous alien fleet appears over the city. People run for shelter.","🏙️","🛸"],["THE ALIEN KING","Alien King: People of Earth! Your planet belongs to me now!","🦸","👽"],["A HERO RISES","Thunderbolt: Not while I still have the power to fight!","🦸","👽"],["THE FIRST STRIKE","Thunderbolt summons lightning, fire, ice, and the strength of a thousand stars!","⚡","👽"],["THE KING'S SECRET","Alien King: You cannot defeat me. My crown absorbs every attack!","🦸","👑"],["THE CHASE","Thunderbolt races through the clouds faster than sound to rescue the city.","🦸","🛸"],["THE FINAL PLAN","Thunderbolt realizes that kindness, not brute force, can break the crown's spell.","💙","👑"],["THE FINAL BATTLE","The sky flashes with light as Thunderbolt makes one last brave move!","🦸","👽"],["EARTH IS SAVED","The crown shatters. The invasion ends. The city cheers for its hero.","🌎","✨"],["A NEW BEGINNING","Thunderbolt: As long as Earth needs me, I will be here.","🦸","🌟"],["TO BE CONTINUED","But somewhere deep in space... another mysterious signal begins to glow.","🌌","❓"]];const duration=180,segment=duration/scenes.length;let t=0,playing=false,muted=false,last=0,spoken=-1;const $=id=>document.getElementById(id);function speak(s){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.rate=.86;u.pitch=.85;speechSynthesis.speak(u)}function render(){const n=Math.min(scenes.length-1,Math.floor(t/segment)),s=scenes[n];$('sceneTitle').textContent=s[0];$('caption').textContent=s[1];$('hero').textContent=s[2];$('alien').textContent=s[3];$('screen').classList.toggle('blast',n===4||n===8);$('seek').value=Math.round(t/duration*1000);const fmt=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(Math.floor(x%60)).padStart(2,'0');$('clock').textContent=fmt(t)+' / '+fmt(duration);if(playing&&n!==spoken){spoken=n;speak(s[0]+'. '+s[1])}}function frame(ms){if(playing){if(last)t+=(ms-last)/1000;if(t>=duration){t=duration;playing=false;$('play').textContent='▶ Play Again';speechSynthesis?.cancel()}render()}last=ms;requestAnimationFrame(frame)}$('play').onclick=()=>{if(t>=duration)t=0;playing=!playing;$('play').textContent=playing?'⏸ Pause':'▶ Play Movie';spoken=-1;if(!playing&&'speechSynthesis'in window)speechSynthesis.cancel();render()};$('restart').onclick=()=>{t=0;spoken=-1;playing=false;$('play').textContent='▶ Play Movie';if('speechSynthesis'in window)speechSynthesis.cancel();render()};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Narration Off':'🔊 Narration On';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()};$('seek').oninput=e=>{t=+e.target.value/1000*duration;spoken=-1;render()};render();requestAnimationFrame(frame);</script></html>
